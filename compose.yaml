services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDbSettings__ConnectionString: mongodb://mongo:27017

  mongo:
    image: mongo:8.0
    ports:
      - "27018:27017"
    volumes: 
      - mongo-data:/data/db

volumes:
  mongo-data: